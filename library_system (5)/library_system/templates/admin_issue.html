{% extends "base.html" %}
{% block title %}Issue a book — Stacks{% endblock %}
{% block content %}
<div class="form-card" style="max-width:520px;">
  <h2>Issue a book</h2>
  <p class="sub">Enter the student's roll number and pick a title with copies available.</p>
  <form method="post">
    <div class="field">
      <label for="roll_no">Student roll number</label>
      <input type="text" id="roll_no" name="roll_no" required autofocus>
    </div>
    <div class="field">
      <label for="book_id">Book</label>
      <select id="book_id" name="book_id" required>
        {% for book in books %}
          <option value="{{ book.id }}">{{ book.title }} — {{ book.available_copies }} available</option>
        {% endfor %}
      </select>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Issue book (14-day loan)</button>
  </form>
</div>
{% endblock %}
