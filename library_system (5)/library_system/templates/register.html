{% extends "base.html" %}
{% block title %}Get a library card — Stacks{% endblock %}
{% block content %}
<div class="form-card">
  <h2>Get a library card</h2>
  <p class="sub">Register once with your roll number to start reserving books.</p>
  <form method="post">
    <div class="field">
      <label for="roll_no">Roll number</label>
      <input type="text" id="roll_no" name="roll_no" required autofocus>
    </div>
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Create account</button>
  </form>
  <p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
</div>
{% endblock %}
